<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Add Coding Problem</title>

<link rel="icon" href="{{ url_for('static', filename='media/logo.jpeg') }}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
}

/* PARTICLES */

#particles-js{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

/* NAVBAR */

.navbar{
background:rgba(0,0,0,0.6);
}

.logo{
height:40px;
margin-right:10px;
}

/* CARD */

.card{
background:white;
color:black;
border-radius:12px;
box-shadow:0 8px 25px rgba(0,0,0,0.3);
}

/* TESTCASE CARD */

.testcase-card{
background:#f8f9fa;
border-radius:10px;
padding:15px;
margin-top:15px;
}

</style>

</head>

<body>

<div id="particles-js"></div>

<!-- NAVBAR -->

<nav class="navbar navbar-dark">

<div class="container-fluid">

<a class="navbar-brand d-flex align-items-center">

<img src="{{ url_for('static', filename='media/logo.jpeg') }}" class="logo">

<b>SSB Training And Placement Pvt Ltd - Admin</b>

</a>

<a href="/" class="btn btn-light">Logout</a>

</div>

</nav>

<!-- PAGE CONTENT -->

<div class="container mt-5">

<div class="card shadow p-4">

<h2 class="mb-4">Add Coding Problem</h2>

<form action="/add_coding_problem" method="POST">

<div class="mb-3">
<label class="form-label">Problem Title</label>
<input type="text" name="title" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Difficulty</label>
<select name="difficulty" class="form-control">
<option value="Easy">Easy</option>
<option value="Medium">Medium</option>
<option value="Hard">Hard</option>
</select>
</div>

<div class="mb-3">
<label class="form-label">Description</label>
<textarea name="description" class="form-control" rows="5"></textarea>
</div>

<div class="mb-3">
<label class="form-label">Inputs Per Test Case</label>
<select id="inputCount" class="form-control" onchange="createTestCases()">
<option value="1">1 Input</option>
<option value="2">2 Inputs</option>
<option value="3">3 Inputs</option>
<option value="4">4 Inputs</option>
<option value="5">5 Inputs</option>
</select>
</div>

<div id="testcases"></div>

<br>

<button type="submit" class="btn btn-success">
Add Problem
</button>

<a href="/admin_coding_judge" class="btn btn-secondary">
Back
</a>

</form>

</div>

</div>

<script>

/* CREATE TEST CASES */

function createTestCases(){

let container = document.getElementById("testcases")
let inputCount = document.getElementById("inputCount").value

container.innerHTML = ""

for(let i=1;i<=5;i++){

let inputsHTML=""

for(let j=1;j<=inputCount;j++){

inputsHTML += `
<label>Input ${j}</label>
<textarea name="input${j}_${i}" class="form-control mb-2"></textarea>
`

}

container.innerHTML += `

<div class="testcase-card">

<h5>Test Case ${i}</h5>

${inputsHTML}

<label>Expected Output</label>
<textarea name="output_${i}" class="form-control"></textarea>

</div>

`

}

}

window.onload = createTestCases

/* PARTICLES BACKGROUND */

particlesJS("particles-js",{

particles:{
number:{value:70},
color:{value:"#ffffff"},
shape:{type:"circle"},
opacity:{value:0.4},
size:{value:3},
line_linked:{
enable:true,
distance:150,
color:"#ffffff",
opacity:0.3,
width:1
},
move:{
enable:true,
speed:2
}
}

});

</script>

</body>
</html>
