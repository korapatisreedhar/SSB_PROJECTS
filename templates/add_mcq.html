<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Add MCQ Question</title>

<link rel="icon" href="{{ url_for('static', filename='media/logo.jpeg') }}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
}

#particles-js{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

.navbar{
background:rgba(0,0,0,0.6);
}

.logo{
height:40px;
margin-right:10px;
}

.card{
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

label{
font-weight:500;
}

</style>

</head>

<body>

<div id="particles-js"></div>

<nav class="navbar navbar-dark">
<div class="container-fluid">

<a class="navbar-brand d-flex align-items-center">
<img src="{{ url_for('static', filename='media/logo.jpeg') }}" class="logo">
<b>SSB Training And Placement Pvt Ltd - Admin</b>
</a>

<a href="/" class="btn btn-light">Logout</a>

</div>
</nav>

<div class="container py-5">
<div class="row justify-content-center">
<div class="col-lg-7 col-md-9">

<div class="card p-4">

<h3 class="mb-4 text-center">Add MCQ Question</h3>

<form action="/add_mcq" method="POST">

<!-- Question Number -->
<div class="mb-3">
<label>Question Number</label>
<input type="number" name="question_number" id="questionNumber" class="form-control" required>
</div>

<!-- Section Number -->
<div class="mb-3">
<label>Section Number</label>
<input type="text" id="sectionNumber" name="section_number" class="form-control" placeholder="Auto or manual">
</div>

<!-- Section Name -->
<div class="mb-3">
<label>Section Name</label>
<input type="text" id="sectionName" name="section_name" class="form-control" placeholder="Auto or manual">
</div>

<!-- Question -->
<div class="mb-3">
<label>Question</label>
<textarea name="question" class="form-control" required></textarea>
</div>

<!-- Options -->
<div class="mb-2">
<label>Option A</label>
<input type="text" name="option_a" class="form-control" required>
</div>

<div class="mb-2">
<label>Option B</label>
<input type="text" name="option_b" class="form-control" required>
</div>

<div class="mb-2">
<label>Option C</label>
<input type="text" name="option_c" class="form-control" required>
</div>

<div class="mb-2">
<label>Option D</label>
<input type="text" name="option_d" class="form-control" required>
</div>

<!-- Domain -->
<div class="mb-3">
<label>Domain</label>
<select class="form-control" name="domain">
<option value="Python">Python</option>
<option value="Java">Java</option>
</select>
</div>

<!-- Answer -->
<div class="mb-4">
<label>Correct Answer</label>
<select name="answer" class="form-control" required>
<option value="A">A</option>
<option value="B">B</option>
<option value="C">C</option>
<option value="D">D</option>
</select>
</div>

<div class="d-flex justify-content-between">
<button class="btn btn-success px-4">Add MCQ</button>
<a href="/admin_coding_judge" class="btn btn-secondary">Back</a>
</div>

</form>

</div>

</div>
</div>
</div>

<script>
particlesJS("particles-js",{
particles:{
number:{value:70},
color:{value:"#ffffff"},
shape:{type:"circle"},
opacity:{value:0.4},
size:{value:3},
line_linked:{
enable:true,
distance:150,
color:"#ffffff",
opacity:0.3,
width:1
},
move:{enable:true,speed:2}
}
});
</script>

<!-- SECTION LOGIC -->
<script>
const input = document.getElementById("questionNumber");
const sectionNum = document.getElementById("sectionNumber");
const sectionName = document.getElementById("sectionName");

function updateSection() {

let num = parseInt(input.value);

if (sectionNum.dataset.manual === "true" || sectionName.dataset.manual === "true") return;

let secNo = "";
let secName = "";

if (!num){
secNo = "";
secName = "";
}
else if (num >= 1 && num <= 5){
secNo = "SECTION-1";
secName = "APTITUDE";
}
else if (num >= 6 && num <= 10){
secNo = "SECTION-2";
secName = "LOGICAL REASONING";
}
else if (num >= 11 && num <= 15){
secNo = "SECTION-3";
secName = "COMPUTER FUNDAMENTALS";
}
else if (num >= 16 && num <= 20){
secNo = "SECTION-4";
secName = "PROGRAMMING";
}
else if (num >= 21 && num <= 25){
secNo = "SECTION-5";
secName = "TECHNICAL";
}
else{
secNo = "OUT";
secName = "OUT OF RANGE";
}

sectionNum.value = secNo;
sectionName.value = secName;
}

// manual override
sectionNum.addEventListener("input", ()=> sectionNum.dataset.manual="true");
sectionName.addEventListener("input", ()=> sectionName.dataset.manual="true");

input.addEventListener("input", updateSection);
</script>

</body>
</html>
