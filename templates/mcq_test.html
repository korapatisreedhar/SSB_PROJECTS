<!DOCTYPE html>
<html>
<head>
    <title>MCQ Test</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

<h2 class="mb-4">MCQ Assessment</h2>

<form action="/submit_mcq" method="POST">

{% for q in questions %}

<div class="card mb-3 p-3 shadow-sm">

<p><b>{{ q[1] }}. {{ q[2] }}</b></p>

<label>
<input type="radio" name="q{{q[0]}}" value="A">
{{ q[3] }}
</label><br>

<label>
<input type="radio" name="q{{q[0]}}" value="B">
{{ q[4] }}
</label><br>

<label>
<input type="radio" name="q{{q[0]}}" value="C">
{{ q[5] }}
</label><br>

<label>
<input type="radio" name="q{{q[0]}}" value="D">
{{ q[6] }}
</label>

</div>

{% endfor %}

<button type="submit" class="btn btn-primary">Submit MCQ</button>

</form>

</div>

</body>
</html>
