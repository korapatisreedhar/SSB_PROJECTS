<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>View Status</title>

<link rel="icon" href="{{ url_for('static', filename='media/logo.jpeg') }}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Segoe UI';
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
}

/* PARTICLES BACKGROUND */
#particles-js{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
}

/* CONTENT ABOVE PARTICLES */
.container, .container-fluid{
position:relative;
z-index:1;
}

/* CARD STYLE */
.card-box{
background:white;
color:black;
border-radius:12px;
padding:30px;
box-shadow:0 8px 25px rgba(0,0,0,0.3);
text-align:center;
transition:0.3s;
}

.card-box:hover{
transform:translateY(-5px);
}

/* BACK BUTTON */
.back-btn{
background:white;
color:black;
border-radius:6px;
padding:8px 15px;
text-decoration:none;
display:inline-block;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.back-btn:hover{
background:#e2e2e2;
}
</style>
</head>

<body>

<!-- PARTICLES -->
<div id="particles-js"></div>

<!-- TOP BAR -->
<div class="container-fluid p-3">
    <a href="/admin_dashboard" class="back-btn">
        ← Back
    </a>
</div>

<!-- MAIN CONTENT -->
<div class="container mt-3">

<h2 class="mb-4 text-center">View Candidate Status</h2>

<div class="row g-4">

<div class="col-md-6">
<div class="card-box">
<h4>Selected Candidates</h4>
<p>View all selected candidates</p>
<a href="/view_selected" class="btn btn-success">View Selected</a>
</div>
</div>

<div class="col-md-6">
<div class="card-box">
<h4>Rejected Candidates</h4>
<p>View rejected & cheated candidates</p>
<a href="/view_rejected" class="btn btn-danger">View Rejected</a>
</div>
</div>

</div>

</div>

<!-- PARTICLES SCRIPT -->
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>
particlesJS("particles-js",{
particles:{
number:{value:70},
color:{value:"#ffffff"},
shape:{type:"circle"},
opacity:{value:0.4},
size:{value:3},
line_linked:{
enable:true,
distance:150,
color:"#ffffff",
opacity:0.3,
width:1
},
move:{
enable:true,
speed:2
}
}
});
</script>

</body>
</html>
