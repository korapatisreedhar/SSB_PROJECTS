<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>View Status</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
font-family:Segoe UI;
}
.card-box{
background:white;
color:black;
border-radius:12px;
padding:30px;
box-shadow:0 8px 25px rgba(0,0,0,0.3);
text-align:center;
}
</style>
</head>

<body>

<div class="container mt-5">

<h2 class="mb-4 text-center">View Candidate Status</h2>

<div class="row">

<div class="col-md-6">
<div class="card-box">
<h4>Selected Candidates</h4>
<p>View all selected candidates</p>
<a href="/view_selected" class="btn btn-success">View Selected</a>
</div>
</div>

<div class="col-md-6">
<div class="card-box">
<h4>Rejected Candidates</h4>
<p>View rejected & cheated candidates</p>
<a href="/view_rejected" class="btn btn-danger">View Rejected</a>
</div>
</div>

</div>

</div>

</body>
</html>
