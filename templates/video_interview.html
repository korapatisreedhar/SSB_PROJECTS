<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AI Interview</title>

<link rel="icon" href="{{ url_for('static', filename='media/logo.jpeg') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
min-height:100vh;
overflow-x:hidden;
}

.navbar{background:rgba(0,0,0,0.7);}
.logo{height:40px;margin-right:10px;}

.sidebar{
min-height:100vh;
background:rgba(0,0,0,0.5);
padding-top:25px;
}

.sidebar a{
display:block;
color:white;
padding:12px 20px;
text-decoration:none;
border-radius:6px;
margin:6px 10px;
transition:0.3s;
}

.sidebar a:hover{
background:rgba(255,255,255,0.2);
transform:translateX(6px);
}

.sidebar a.active{
background:rgba(255,255,255,0.2);
border-left:4px solid #38BDF8;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
color:black;
}

video{
width:100%;
border-radius:10px;
background:black;
}

</style>
</head>

<body>

<nav class="navbar navbar-dark">
<div class="container-fluid">
<a class="navbar-brand d-flex align-items-center">
<img src="{{ url_for('static', filename='media/logo.jpeg') }}" class="logo">
<b>SSB Training And Placement Pvt Ltd</b>
</a>
</div>
</nav>

<div class="container-fluid">
<div class="row">

<div class="col-md-2 sidebar">
<h5 class="text-center">👨‍💻 Candidate Panel</h5>
<a href="/dashboard">🏠 Dashboard</a>
<a href="/coding_editor">💻 Coding Assessment</a>
<a class="active" href="/video_interview">🤖 AI Interview</a>
<a href="/performance">📊 Performance</a>
<a href="/profile">👤 Profile</a>
<a href="/">🚪 Logout</a>
</div>

<div class="col-md-10 p-4">

<h2 class="mb-4">🤖 AI Interview</h2>

<div class="card p-4">

<div class="row">

<div class="col-md-6">
<video id="video" autoplay muted></video>
</div>

<div class="col-md-6">

<h5>Interview Question</h5>

<p id="question">Click Start Interview</p>

<p id="status" style="color:green;font-weight:bold;"></p>

<p>⏱ Time Left: <span id="time">30:00</span></p>

<button id="startBtn" class="btn btn-primary" onclick="toggleInterview()">
Start Interview
</button>

<button id="nextBtn" class="btn btn-success mt-2" onclick="nextQuestion()" style="display:none;">
Next Question
</button>

<hr>

<h6>Your Answer (Speech-to-Text)</h6>
<p id="answer"></p>

<p id="warning" style="color:red;font-weight:bold;"></p>

</div>
</div>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>

<script>

let objectDetectInterval;
let model;
let stream;
let recorder;
let chunks=[];
let recognition;

/* Disable right-click, copy, paste */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("copy", e => e.preventDefault());
document.addEventListener("paste", e => e.preventDefault());
let running=false;
let submitted=false;
let index=0;
let answers=[];
let currentAnswer="";
fetch("/check_ai_unlock")
.then(res => res.json())
.then(data => {

if(!data.allowed){

document.getElementById("status").innerText =
"AI Interview Locked. Score 75+ required in Coding Assessment.";

document.getElementById("startBtn").disabled = true;

}

});

/* ======================
AI INTERVIEW LOCK CHECK
====================== */

fetch("/check_ai_unlock")
.then(res=>res.json())
.then(data=>{

if(!data.allowed){

document.getElementById("status").innerText =
"AI Interview Locked. Score 75+ required in Coding Assessment.";

document.getElementById("startBtn").disabled = true;

}

});

let faceCheckInterval;
let cheatingCount=0;
let cheatingDetected=false;
let silenceTimer;
let timer;
let time=1800;

/* LOAD MODELS */

async function loadModel(){
model = await cocoSsd.load();
}

loadModel();

let faceModel;

async function loadFaceModel(){
faceModel = await blazeface.load();
}

loadFaceModel();

/* OBJECT DETECTION */

async function detectObjects(){

if(!running || !model) return;

const video = document.getElementById("video");

if(video.readyState!==4) return;

let predictions=[];

try{
predictions = await model.detect(video);
}catch(e){
return;
}

let personCount = 0;

predictions.forEach(p=>{

if(p.class === "person"){
personCount++;
}

if(p.class === "cell phone"){

alert("⚠ Mobile phone detected!");

cheatingDetected = true;

endInterview();

}

});

if(personCount >= 2){

alert("⚠ Another person detected behind you.");

cheatingDetected = true;

endInterview();

}

}

/* FACE MONITORING */

async function monitorFace(){

if(!running || !faceModel) return;

const video = document.getElementById("video");

if(video.readyState !== 4) return;

const predictions = await faceModel.estimateFaces(video,{
returnTensors:false,
flipHorizontal:false
});

if(predictions.length === 0){

alert("⚠ No face detected.");

cheatingDetected = true;
endInterview();
return;

}

if(predictions.length >= 2){

alert("⚠ Multiple faces detected.");

cheatingDetected = true;
endInterview();
return;

}

/* LOOKING LEFT RIGHT */

const face = predictions[0];

const leftEye = face.landmarks[0];
const rightEye = face.landmarks[1];
const nose = face.landmarks[2];

const eyeCenter = (leftEye[0] + rightEye[0]) / 2;

const deviation = Math.abs(nose[0] - eyeCenter);

if(deviation > 25){

cheatingCount++;

document.getElementById("status").innerText =
"⚠ Please look straight at the camera (" + cheatingCount + "/2)";

if(cheatingCount >= 2){

alert("⚠ Looking away repeatedly.");

cheatingDetected = true;
endInterview();

}

}else{

cheatingCount = 0;

document.getElementById("status").innerText =
"Interview Running Normally";

}

}

/* CAMERA */

async function startCamera(){

try{

stream = await navigator.mediaDevices.getUserMedia({
video:{
width:640,
height:480,
facingMode:"user"
},
audio:true
});

document.getElementById("video").srcObject=stream;

stream.getVideoTracks()[0].onended=function(){

alert("Camera turned OFF");
endInterview();

};

}catch(err){

alert("Please allow camera permissions");

}

}

startCamera();

/* QUESTIONS */

const questions=[
"Tell me about yourself",
"What are your strengths and weaknesses",
"Explain a challenging project you worked on",
"Where do you see yourself in five years",
"Why should we hire you"
];

/* SPEECH */

function startSpeech(){

const SpeechRecognition =
window.SpeechRecognition || window.webkitSpeechRecognition;

recognition=new SpeechRecognition();
recognition.continuous=true;

recognition.onresult=function(event){

let transcript="";

for(let i=event.resultIndex;i<event.results.length;i++){

if(event.results[i].isFinal){
transcript+=event.results[i][0].transcript+" ";
}

}

currentAnswer+=transcript;

document.getElementById("answer").innerText=currentAnswer;

};

recognition.onend=function(){
if(running){
recognition.start();
}
};

recognition.start();

}

/* SPEAK */

function speak(text){

if(recognition) recognition.stop();

let speech=new SpeechSynthesisUtterance(text);

speech.onend=function(){
if(recognition) recognition.start();
};

window.speechSynthesis.speak(speech);

}

/* QUESTIONS */

function askQuestion(){

if(currentAnswer.trim().length > 10){
answers.push(currentAnswer.trim());
}

currentAnswer="";

document.getElementById("answer").innerText="";

if(index<questions.length){

let q=questions[index];

document.getElementById("question").innerText=q;

document.getElementById("nextBtn").style.display="inline-block";

speak(q);

index++;

clearTimeout(silenceTimer);

silenceTimer=setTimeout(()=>{

if(currentAnswer.trim()===""){
nextQuestion();
}

},10000);

}else{

endInterview();

}

}

function nextQuestion(){

document.getElementById("nextBtn").style.display="none";

setTimeout(()=>{

speak("Moving to next question");

askQuestion();

},2000);

}

/* TIMER */

function startTimer(){

timer=setInterval(()=>{

time--;

let minutes=Math.floor(time/60);
let seconds=time%60;

document.getElementById("time").innerText=
minutes+":"+(seconds<10?"0"+seconds:seconds);

if(time<=0){
endInterview();
}

},1000);

}

/* RECORDING */

function startRecording(){

chunks=[];

recorder = new MediaRecorder(stream,{mimeType:'video/webm'});

recorder.ondataavailable = function(e){
if(e.data && e.data.size > 0){
chunks.push(e.data);
}
};

recorder.start();

}

function stopRecording(){

if(!recorder) return;

recorder.onstop = function(){

const blob = new Blob(chunks,{type:'video/webm'});

let fd = new FormData();
fd.append("video", blob, "interview.webm");

fetch("/save_interview_video",{
method:"POST",
body:fd
});

};

recorder.stop();

}
/* START INTERVIEW */

async function startInterview(){

if(running) return;

enterFullScreen();

running=true;

answers=[];
index=0;

document.getElementById("status").innerText="Interview Started";

document.getElementById("startBtn").innerText="End Interview";

startSpeech();
askQuestion();
startTimer();
startRecording();

objectDetectInterval=setInterval(detectObjects,1000);

setTimeout(()=>{
faceCheckInterval = setInterval(monitorFace,2000);
},3000);

}

/* TOGGLE */

function toggleInterview(){

if(!running){
startInterview();
}else{
endInterview();
}

}

/* TAB SWITCH */

document.addEventListener("visibilitychange",function(){

if(document.hidden && running){

alert("Tab switching detected");

cheatingDetected=true;

endInterview();

}

});

/* FULLSCREEN */

function enterFullScreen(){

let elem=document.documentElement;

if(elem.requestFullscreen){
elem.requestFullscreen();
}

}

/* END INTERVIEW */

function endInterview(){

running=false;

clearInterval(timer);
clearInterval(objectDetectInterval);
clearInterval(faceCheckInterval);
clearTimeout(silenceTimer);

document.getElementById("status").innerText="Interview Completed";
document.getElementById("startBtn").disabled=true;
document.getElementById("nextBtn").style.display="none";

if(recognition){
recognition.stop();
}

if(currentAnswer.trim()!==""){
answers.push(currentAnswer.trim());
}

stopRecording();
if(!submitted){

submitted=true;

fetch("/submit_interview",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
answers: answers,
status: cheatingDetected ? "cheated" : "completed",
answer_length: answers.join(" ").length
})
});

}

if(stream){
stream.getTracks().forEach(track=>track.stop());
}

document.getElementById("question").innerText="Interview Completed";

if(document.fullscreenElement){
document.exitFullscreen();
}

setTimeout(()=>{
window.location.href="/dashboard";
},2500);

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
