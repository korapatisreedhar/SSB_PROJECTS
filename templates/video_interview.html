<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AI Interview</title>

<link rel="icon" href="{{ url_for('static', filename='media/logo.jpeg') }}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
min-height:100vh;
overflow-x:hidden;
}

.navbar{background:rgba(0,0,0,0.7);}
.logo{height:40px;margin-right:10px;}

.sidebar{
min-height:100vh;
background:rgba(0,0,0,0.5);
padding-top:25px;
}

.sidebar a{
display:block;
color:white;
padding:12px 20px;
text-decoration:none;
border-radius:6px;
margin:6px 10px;
transition:0.3s;
}

.sidebar a:hover{
background:rgba(255,255,255,0.2);
transform:translateX(6px);
}

.sidebar a.active{
background:rgba(255,255,255,0.2);
border-left:4px solid #38BDF8;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
color:black;
}

video{
width:100%;
border-radius:10px;
background:black;
}
</style>
</head>

<body>

<nav class="navbar navbar-dark">
<div class="container-fluid">
<a class="navbar-brand d-flex align-items-center">
<img src="{{ url_for('static', filename='media/logo.jpeg') }}" class="logo">
<b>SSB Training And Placement Pvt Ltd</b>
</a>
</div>
</nav>

<div class="container-fluid">
<div class="row">

<div class="col-md-2 sidebar">
<h5 class="text-center">👨‍💻 Candidate Panel</h5>
<a href="/dashboard">🏠 Dashboard</a>
<a href="/coding_editor">💻 Coding Assessment</a>
<a class="active" href="/video_interview">🤖 AI Interview</a>
<a href="/performance">📊 Performance</a>
<a href="/profile">👤 Profile</a>
<a href="/">🚪 Logout</a>
</div>

<div class="col-md-10 p-4">

<h2 class="mb-4">🤖 AI Interview</h2>

<div class="card p-4">

<div class="row">

<div class="col-md-6">
<video id="video" autoplay muted></video>
</div>

<div class="col-md-6">

<h5>Interview Question</h5>

<p id="question">Click Start Interview</p>

<p id="status" style="color:green;font-weight:bold;"></p>

<p>⏱ Time Left: <span id="time">60</span>s</p>

<button id="startBtn" class="btn btn-primary" onclick="toggleInterview()">
Start Interview
</button>

<hr>

<h6>Your Answer (Speech-to-Text)</h6>
<p id="answer"></p>

<p id="warning" style="color:red;font-weight:bold;"></p>

</div>

</div>
</div>
</div>
</div>
</div>

<script>

/* ======================
INTERVIEW ATTEMPT CHECK
====================== */

fetch("/check_interview")
.then(res=>res.json())
.then(data=>{

if(data.completed){

document.getElementById("question").innerText="Interview already completed";
document.getElementById("status").innerText="You already attempted this interview";
document.getElementById("startBtn").disabled=true;

}

});

/* ======================
CAMERA PERMISSION
====================== */

let stream;

async function startCamera(){

document.getElementById("warning").innerText =
"Please allow Camera and Microphone permission to continue.";

try{

stream = await navigator.mediaDevices.getUserMedia({
video:true,
audio:true
});

document.getElementById("video").srcObject = stream;

document.getElementById("warning").innerText =
"Camera and Microphone connected successfully.";

stream.getVideoTracks()[0].onended = function(){

document.getElementById("warning").innerText="⚠ Camera turned OFF";
alert("Camera is turned OFF");
endInterview();

};

}catch(err){

document.getElementById("warning").innerText =
"⚠ Camera & Microphone permission denied. Please allow permissions.";

alert("Please allow Camera and Microphone permission to start interview");

}

}

startCamera();

/* ======================
QUESTIONS
====================== */

const questions=[
"Tell me about yourself",
"What are your strengths",
"Explain a challenging project you worked on",
"Why should we select you for this internship"
];

let index=0;
let answers=[];
let currentAnswer="";

/* ======================
FACE CHECK
====================== */

async function checkFace(){

if(!('FaceDetector' in window)) return true;

const detector = new FaceDetector();
const faces = await detector.detect(document.getElementById("video"));

if(faces.length===0){
alert("⚠ No face detected. Please sit in front of camera.");
return false;
}

if(faces.length>1){
alert("⚠ Multiple faces detected.");
return false;
}

return true;

}

/* ======================
SPEECH
====================== */

let recognition;

function startSpeech(){

recognition=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
recognition.continuous=true;

recognition.onresult=function(event){

let transcript=event.results[event.results.length-1][0].transcript;
currentAnswer+=transcript+" ";
document.getElementById("answer").innerText=currentAnswer;

};

recognition.start();

}

function speak(text){

if(recognition) recognition.stop();

let speech=new SpeechSynthesisUtterance(text);

speech.onend=function(){
setTimeout(()=>{ if(recognition) recognition.start(); },500);
};

window.speechSynthesis.speak(speech);

}

/* ======================
ASK QUESTION
====================== */

function askQuestion(){

if(currentAnswer!=""){
answers.push(currentAnswer);
currentAnswer="";
document.getElementById("answer").innerText="";
}

if(index<questions.length){

let q=questions[index];
document.getElementById("question").innerText=q;
speak(q);
index++;

}else{
endInterview();
}

}

/* ======================
TIMER
====================== */

let time=60;
let timer;

function startTimer(){

timer=setInterval(()=>{

time--;
document.getElementById("time").innerText=time;

if(time<=0){
endInterview();
}

},1000);

}

/* ======================
RECORDING
====================== */

let recorder;
let chunks=[];

function startRecording(){

recorder=new MediaRecorder(stream);
recorder.ondataavailable=e=>chunks.push(e.data);
recorder.start();

}

function stopRecording(){

if(!recorder) return;

recorder.stop();

const blob=new Blob(chunks,{type:'video/webm'});

let fd=new FormData();
fd.append("video",blob,"interview.webm");

fetch("/save_interview_video",{method:"POST",body:fd});

}

/* ======================
INTERVIEW CONTROL
====================== */

let running=false;

async function startInterview(){

if(!stream){
alert("Please allow camera access before starting interview");
return;
}

let tracks = stream.getVideoTracks();

if(tracks.length===0 || tracks[0].readyState!=="live"){
alert("Camera must be ON to start interview");
return;
}

let ok = await checkFace();
if(!ok) return;

enterFullScreen();

running=true;

document.getElementById("status").innerText="Interview Started";

document.getElementById("startBtn").innerText="End Interview";

startSpeech();
askQuestion();
startTimer();
startRecording();

}

function toggleInterview(){

if(!running){
startInterview();
}else{
endInterview();
}

}

function endInterview(){

running=false;

clearInterval(timer);

document.getElementById("status").innerText="Interview Completed";

document.getElementById("startBtn").disabled=true;

stopRecording();

/* SAVE INTERVIEW STATUS */

fetch("/submit_interview",{method:"POST"});

if(stream){
stream.getTracks().forEach(track=>track.stop());
}

document.getElementById("question").innerText="Interview Completed";

if(document.fullscreenElement){
document.exitFullscreen();
}

setTimeout(function(){
window.location.replace("/dashboard");
},2500);

}
function enterFullScreen(){

let elem=document.documentElement;

if(elem.requestFullscreen){
elem.requestFullscreen();
}

}

</script>

</body>
</html>
