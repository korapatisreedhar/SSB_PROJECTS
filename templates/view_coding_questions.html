<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>View Coding Questions</title>

<link rel="icon" href="{{ url_for('static', filename='media/logo.jpeg') }}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<style>

/* BODY */
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
}

/* PARTICLES */
#particles-js{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

/* 🔥 NAVBAR */
.navbar-custom{
background:rgba(0,0,0,0.6);
padding:10px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
height:40px;
margin-right:10px;
}

/* CARD */
.question-card{
background:white;
color:#111827;
border-radius:12px;
padding:22px;
box-shadow:0 6px 20px rgba(0,0,0,0.2);
transition:0.25s;
height:100%;
display:flex;
flex-direction:column;
}

.question-card:hover{
transform:translateY(-4px);
}

/* HEADER ROW */
.card-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

/* TITLE */
.title{
font-size:16px;
font-weight:600;
}

/* BADGES */
.badge-pill{
padding:4px 10px;
border-radius:20px;
font-size:12px;
font-weight:600;
}

.easy{background:#16a34a;color:white;}
.medium{background:#f59e0b;color:white;}
.hard{background:#dc2626;color:white;}

/* DESCRIPTION */
.description{
font-size:14px;
color:#4b5563;
margin-top:8px;
flex-grow:1;
}

/* RESPONSIVE */
@media(max-width:768px){
.title{font-size:14px;}
.description{font-size:13px;}
}

</style>

</head>

<body>

<div id="particles-js"></div>

<!-- 🔥 NAVBAR -->
<div class="navbar-custom">

<div class="d-flex align-items-center">



<img src="{{ url_for('static', filename='media/logo.jpeg') }}" class="logo">

<b>SSB Training And Placement Pvt Ltd</b>

</div>
<a href="/admin_dashboard" class="btn btn-light">← Back</a>
</div>

<div class="container py-5">

<h2 class="text-center mb-5">Coding Questions</h2>

<div class="row g-4">

{% for p in problems %}

<div class="col-lg-4 col-md-6 col-sm-12">

<div class="question-card">

<div class="card-top">

<div class="title">{{ p[1] }}</div>

<span class="badge-pill
{% if p[2]=='Easy' %}easy
{% elif p[2]=='Medium' %}medium
{% else %}hard
{% endif %}
">
{{ p[2] }}
</span>

</div>

<p class="description">{{ p[3] }}</p>

</div>

</div>

{% endfor %}

</div>

</div>

<script>

/* BACK BUTTON */
function goBack(){
window.history.back();
}

/* PARTICLES */
particlesJS("particles-js",{
particles:{
number:{value:70},
color:{value:"#ffffff"},
shape:{type:"circle"},
opacity:{value:0.4},
size:{value:3},
line_linked:{
enable:true,
distance:150,
color:"#ffffff",
opacity:0.3,
width:1
},
move:{
enable:true,
speed:2
}
}
});

</script>

</body>
</html>
