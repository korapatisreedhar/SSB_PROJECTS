<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>View Coding Questions</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
}

/* PARTICLES */

#particles-js{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

/* NAVBAR */

.navbar{
background:rgba(0,0,0,0.6);
}

.logo{
height:40px;
margin-right:10px;
}

/* CARD DESIGN */

.question-card{
background:white;
color:black;
border-radius:14px;
padding:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.35);
transition:0.3s;
height:100%;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.question-card:hover{
transform:translateY(-6px);
}

/* BADGES */

.badge-easy{
background:#22c55e;
}

.badge-medium{
background:#f59e0b;
}

.badge-hard{
background:#ef4444;
}

/* DESCRIPTION */

.description{
margin-top:10px;
color:#444;
flex-grow:1;
}

</style>

</head>

<body>

<div class="container py-5">

<h2 class="text-center mb-5">Coding Questions</h2>

<div class="row g-4">

{% for p in problems %}

<div class="col-lg-4 col-md-6 col-sm-12">

<div class="card-body">

<div>

<h5>{{ p[1] }}</h5>

<span class="badge
{% if p[2]=='Easy' %}
badge-easy
{% elif p[2]=='Medium' %}
badge-medium
{% else %}
badge-hard
{% endif %}
">
{{ p[2] }}
</span>

<p class="description">{{ p[3] }}</p>

</div>

</div>

</div>
</div>

{% endfor %}

</div>

</div>

<script>

particlesJS("particles-js",{

particles:{
number:{value:70},
color:{value:"#ffffff"},
shape:{type:"circle"},
opacity:{value:0.4},
size:{value:3},
line_linked:{
enable:true,
distance:150,
color:"#ffffff",
opacity:0.3,
width:1
},
move:{
enable:true,
speed:2
}
}

});

</script>

</body>

</html>
