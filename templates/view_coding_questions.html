<!DOCTYPE html>
<html>
<head>

<title>View Coding Questions</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="mb-4">Coding Questions</h2>

<div class="row">

{% for p in problems %}

<div class="col-md-4">

<div class="card shadow p-3 mb-4">

<h5>{{ p[1] }}</h5>

<p><b>Difficulty:</b> {{ p[2] }}</p>

<p>{{ p[3] }}</p>

</div>

</div>

{% endfor %}

</div>

</div>

</body>
</html>
