<!DOCTYPE html>
<html>
<head>
<title>View MCQ Questions</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

<h2 class="text-center mb-4">MCQ Questions</h2>

<table class="table table-bordered">

<thead class="table-dark">
<tr>
<th>ID</th>
<th>Question No</th>
<th>Question</th>
<th>Option A</th>
<th>Option B</th>
<th>Option C</th>
<th>Option D</th>
<th>Answer</th>
<th>Domain</th>   <!-- ✅ NEW -->
<th>Actions</th>
</tr>
</thead>

<tbody>

{% for q in questions %}

<tr>

<!-- ✅ SERIAL NUMBER -->
<td>{{ loop.index }}</td>

<td>{{ q[1] }}</td>
<td>{{ q[2] }}</td>
<td>{{ q[3] }}</td>
<td>{{ q[4] }}</td>
<td>{{ q[5] }}</td>
<td>{{ q[6] }}</td>
<td>{{ q[7] }}</td>

<!-- ✅ DOMAIN COLUMN -->
<td>{{ q[8] }}</td>

<td>
<a href="/edit_mcq/{{ q[0] }}"
class="btn btn-warning btn-sm">
Edit
</a>

<a href="/delete_mcq/{{ q[0] }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this question?')">
Delete
</a>
</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
