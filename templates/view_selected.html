<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Selected Candidates</title>

<link rel="icon" href="{{ url_for('static', filename='media/logo.jpeg') }}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
margin:0;
font-family:'Segoe UI';
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
}

/* PARTICLES BACKGROUND */
#particles-js{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
}

/* CONTENT ABOVE PARTICLES */
.container, .container-fluid{
position:relative;
z-index:1;
}

/* CARD */
.card-box{
background:white;
color:black;
border-radius:12px;
padding:20px;
box-shadow:0 8px 25px rgba(0,0,0,0.3);
}

/* TABLE */
.table thead{
background:#1e3c72;
color:white;
}

.table tbody tr:hover{
background:#f1f1f1;
}

/* TITLE */
.page-title{
text-align:center;
margin-bottom:20px;
font-weight:bold;
}

/* BACK BUTTON */
.back-btn{
background:white;
color:black;
border-radius:6px;
padding:8px 15px;
text-decoration:none;
display:inline-block;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.back-btn:hover{
background:#e2e2e2;
}
</style>

</head>

<body>

<!-- PARTICLES -->
<div id="particles-js"></div>

<!-- TOP BAR -->
<div class="container-fluid p-3">
<a href="/view_status" class="back-btn">
    ← Back
</a>
</div>

<!-- MAIN CONTENT -->
<div class="container mt-3">

<h2 class="page-title">
<i class="fa fa-user-check text-success"></i> Selected Candidates
</h2>

<div class="card-box">

<table class="table table-bordered text-center">

<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody>

{% for c in data %}
<tr>
<td>{{ c[0] }}</td>
<td>{{ c[1] }}</td>

<td>
<span class="badge bg-success">
<i class="fa fa-check-circle"></i> Selected
</span>
</td>

<td>
<a href="/send_mail/{{ c[1] }}/Selected" class="btn btn-success btn-sm">
<i class="fa fa-envelope"></i> Send Mail
</a>
</td>

</tr>
{% endfor %}

</tbody>

</table>

</div>

</div>

<!-- PARTICLES SCRIPT -->
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>
particlesJS("particles-js",{
particles:{
number:{value:70},
color:{value:"#ffffff"},
shape:{type:"circle"},
opacity:{value:0.4},
size:{value:3},
line_linked:{
enable:true,
distance:150,
color:"#ffffff",
opacity:0.3,
width:1
},
move:{
enable:true,
speed:2
}
}
});
</script>

</body>
</html>
